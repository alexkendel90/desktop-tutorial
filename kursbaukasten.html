<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KursBaukasten</title>
<style>
:root{--acc:#f37a1f;--ink:#1d1d1b;--mut:#6b6b68;--line:#dcdcd8;--soft:#f4f4f2;--bad:#c62828}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:14px;color:var(--ink);background:var(--soft);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
.top .name{font-weight:800;letter-spacing:.02em;margin-right:6px}
.top .name i{color:var(--acc);font-style:normal}
.top .title{flex:1;min-width:160px;background:#333330;border:1px solid #4a4a46;color:#fff;border-radius:6px;padding:7px 10px;font-weight:600}
.top .saved{color:#a9a9a4;font-size:12px;min-width:86px;text-align:right}
.b{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.b:hover{border-color:#9a9a95}
.b.p{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700}
.b.d{background:#333330;border-color:#4a4a46;color:#fff}
.b.d:hover{border-color:#8a8a85}
.b.s{padding:2px 7px;font-size:12px}
.b:disabled{opacity:.4;cursor:default}
.work{flex:1;display:flex;min-height:0}
.side{width:270px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px}
.side h3{margin:2px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.les{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px;cursor:pointer;margin-bottom:2px}
.les:hover{background:var(--soft)}
.les.on{background:#fff4ea;border-color:var(--acc)}
.les .n{color:var(--mut);font-size:12px;width:18px;flex:none}
.les .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;background:var(--ink);color:#fff;border-radius:3px;padding:1px 5px;text-transform:uppercase}
.main{flex:1;overflow:auto;padding:22px}
.col{max-width:820px;margin:0 auto}
.lhead{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:6px}
.lhead input.lt{width:100%;font-size:20px;font-weight:700;border:0;border-bottom:2px solid var(--line);padding:4px 0;outline:0}
.lhead input.lt:focus{border-color:var(--acc)}
.lrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.lrow .sp{flex:1}
.ins{display:flex;justify-content:center;height:22px;align-items:center;opacity:.25}
.ins:hover{opacity:1}
.ins button{border:1px dashed var(--mut);background:#fff;border-radius:20px;font-size:11px;padding:1px 12px;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:8px}
.card-h{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafaf8;border-radius:8px 8px 0 0}
.card-h b{flex:1}
.card-h .g{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px}
.card-b{padding:12px}
.f{display:block;margin-bottom:10px}
.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.f textarea{resize:vertical;min-height:64px;line-height:1.45}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.f.chk{display:flex;align-items:center;gap:7px}
.f.chk span{margin:0;font-size:13px;color:var(--ink)}
.item{border:1px solid var(--line);border-radius:6px;padding:9px;margin-bottom:8px;background:#fcfcfb}
.item-h{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.item-h b{flex:1;font-size:12px}
.media{display:flex;gap:10px;align-items:center}
.media img{max-width:150px;max-height:90px;border:1px solid var(--line);border-radius:4px;background:#eee}
.noimg{width:150px;height:70px;border:1px dashed var(--mut);border-radius:4px;display:grid;place-items:center;color:var(--mut);font-size:12px}
.media .btns{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:12px;margin:4px 0 10px}
.warn{background:#fff4ea;border:1px solid var(--acc);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:13px}
.err{background:#fdecec;border:1px solid var(--bad);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:13px}
.stage{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin-bottom:8px}
.stage img{display:block;max-width:100%;max-height:340px;border-radius:4px}
.stage i{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--acc);border:2px solid #fff;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;pointer-events:none}
.stage i.a{outline:3px solid var(--ink)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:50}
.dlg{background:#fff;border-radius:10px;width:100%;max-width:620px}
.dlg.wide{max-width:900px}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{flex:1;margin:0;font-size:17px}
.x{background:none;border:0;font-size:18px;cursor:pointer;padding:4px 8px}
.dlg-b{padding:18px}
.dlg-b h4{margin:18px 0 6px;font-size:14px}
.dlg-b h4:first-child{margin-top:0}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);font-size:12px;font-weight:700;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:6px}
.pal button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px;cursor:pointer}
.pal button:hover{border-color:var(--acc);background:#fff4ea}
.pal small{display:block;color:var(--mut);margin-top:2px}
.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.prow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow .t{flex:1}
.prow small{color:var(--mut);display:block}
.pv{position:fixed;inset:0;background:#3a3a37;z-index:60;display:flex;flex-direction:column}
.pv-h{display:flex;gap:8px;align-items:center;padding:8px 14px;color:#fff}
.pv-h span{flex:1;font-weight:600}
.pv-f{flex:1;display:flex;justify-content:center;min-height:0;padding:0 14px 14px}
.pv iframe{border:0;background:#fff;width:100%;height:100%;border-radius:6px}
.pv.m iframe{width:390px}
@media(max-width:800px){.side{width:200px}}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="work"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>

<!-- ======================= PLAYER (wird in Vorschau und SCORM-Paket eingebettet) ======================= -->
<script type="text/plain" id="player-css">
:root{--acc:#f37a1f;--ink:#1d1d1b;--mut:#63635f;--line:#e0e0dc;--soft:#f5f5f3;--ok:#1f7a45;--bad:#c62828}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:#fff;line-height:1.6;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
img,video{max-width:100%}
#app{height:100%}
.app{display:flex;height:100%}
.side{width:300px;flex:none;background:var(--ink);color:#fff;display:flex;flex-direction:column;overflow:auto}
.brand{padding:22px 22px 0}
.brand img{max-height:38px;max-width:170px;display:block;margin-bottom:16px}
.brand h1{font-size:19px;line-height:1.25;margin:0 0 14px;font-weight:800;cursor:pointer}
.bar{height:6px;background:#44443f;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.pct{font-size:12px;color:#bdbdb8;margin:6px 0 14px}
.nav{padding:0 10px 20px}
.nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:#e8e8e4;padding:10px 12px;border-radius:6px;font-size:15px;line-height:1.35}
.nav button:hover{background:#2e2e2b}
.nav button.on{background:#33332f;color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--acc)}
.nav .dot{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid #7c7c77;margin-top:2px}
.nav .done .dot{background:var(--acc);border-color:var(--acc)}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
.mtop button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:18px}
#view{flex:1;overflow:auto}
.cover{min-height:100%;display:flex;align-items:flex-end;background:var(--ink) center/cover no-repeat;color:#fff;position:relative}
.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.25))}
.cover>div{position:relative;padding:8vh 7vw;max-width:860px}
.cover h2{font-size:clamp(30px,5vw,54px);line-height:1.08;margin:0 0 16px;font-weight:800}
.cover h2:after{content:"";display:block;width:70px;height:6px;background:var(--acc);margin-top:18px}
.cover p{font-size:19px;margin:0 0 26px;color:#ecece8}
.btn{background:var(--acc);border:0;border-radius:4px;padding:11px 24px;font-weight:700;color:var(--ink)}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:#fff;border:2px solid var(--ink);padding:9px 22px}
.btn:focus-visible,.nav button:focus-visible,.opt:focus-within,.chip:focus-visible,.sort li:focus-visible,.hs-dot:focus-visible,.card3:focus-visible,summary:focus-visible,.tabs [role=tab]:focus-visible{outline:3px solid #1464d2;outline-offset:2px}
.lesson{max-width:780px;margin:0 auto;padding:44px 24px 80px}
.kicker{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;font-weight:700}
.lesson>h2{font-size:34px;line-height:1.15;margin:0 0 30px;font-weight:800}
.lesson>h2:after{content:"";display:block;width:54px;height:5px;background:var(--acc);margin-top:14px}
.blk{margin:0 0 30px}
.blk h3{font-size:24px;margin:10px 0 0;font-weight:800;line-height:1.25}
.blk p{margin:0 0 12px}.blk p:last-child,.blk ul:last-child,.blk ol:last-child{margin-bottom:0}
.blk a{color:inherit;text-decoration-color:var(--acc);text-decoration-thickness:2px}
figure{margin:0}figcaption{font-size:14px;color:var(--mut);margin-top:6px}
figure img,figure video{display:block;width:100%;border-radius:4px}
blockquote{margin:0;border-left:6px solid var(--acc);padding:6px 0 6px 22px;font-size:22px;line-height:1.4;font-weight:600}
blockquote footer{font-size:15px;color:var(--mut);font-weight:400;margin-top:8px}
.lst{margin:0;padding-left:24px}.lst li{margin-bottom:6px}
.lst.check{list-style:none;padding:0}.lst.check li{padding-left:30px;position:relative}
.lst.check li:before{content:"✓";position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--acc);font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1}
.callout{border-radius:4px;padding:16px 18px;background:var(--soft);border-left:6px solid var(--ink)}
.callout.tip{border-color:var(--ok)}.callout.warning{border-color:var(--acc);background:#fff4ea}
.callout h4{margin:0 0 4px;font-size:17px}
hr{border:0;border-top:1px solid var(--line);margin:0}
details{border-bottom:1px solid var(--line)}details:first-child{border-top:1px solid var(--line)}
summary{padding:14px 34px 14px 4px;font-weight:700;cursor:pointer;list-style:none;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:8px;top:9px;font-size:24px;color:var(--acc);font-weight:700}
details[open] summary:after{content:"–"}
details>div{padding:0 4px 16px}
.tabs [role=tablist]{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs [role=tab]{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--mut);margin-bottom:-2px;border-bottom:4px solid transparent}
.tabs [role=tab][aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.tabs [role=tabpanel]{padding:18px 4px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card3{background:none;border:0;padding:0;perspective:900px;text-align:center}
.card3>span{display:grid;transition:transform .5s;transform-style:preserve-3d;min-height:170px}
.card3.flip>span{transform:rotateY(180deg)}
.card3 b,.card3 em{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;padding:18px;display:grid;place-items:center;font-style:normal;font-weight:400}
.card3 b{background:var(--ink);color:#fff;font-weight:700;font-size:18px;border-bottom:6px solid var(--acc)}
.card3 em{background:var(--soft);border:1px solid var(--line);transform:rotateY(180deg)}
.hintp{font-size:13px;color:var(--mut);margin:0 0 8px}
.q{border:1px solid var(--line);border-radius:6px;padding:20px;border-top:6px solid var(--ink)}
.q.ok{border-top-color:var(--ok)}.q.bad{border-top-color:var(--bad)}
.q.done .q-body{pointer-events:none}
.q-title{font-weight:700;font-size:19px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt input{margin-top:6px;accent-color:var(--ink);width:16px;height:16px;flex:none}
.right{border-color:var(--ok)!important;background:#e9f5ee!important}
.wrong{border-color:var(--bad)!important;background:#fdecec!important}
.q-fb{margin-top:12px}.q-fb:empty{display:none}
.q.ok .q-fb strong{color:var(--ok)}.q.bad .q-fb strong{color:var(--bad)}
.q-actions{margin-top:14px}
.blank{font:inherit;border:0;border-bottom:2px solid var(--ink);background:var(--soft);padding:2px 6px;margin:0 3px;border-radius:3px 3px 0 0;max-width:100%}
.blank-text{line-height:2.2}
.sort{list-style:none;margin:0;padding:0}
.sort li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:grab;user-select:none;-webkit-user-select:none}
.sort li.drag{box-shadow:0 6px 18px rgba(0,0,0,.2);border-color:var(--acc)}
.grip{color:var(--mut);touch-action:none;font-size:20px;line-height:1;padding:2px 4px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;align-items:stretch}
.mleft{background:var(--soft);border-radius:4px;padding:10px 12px;display:flex;align-items:center}
.slot{border:2px dashed #a8a8a3;border-radius:4px;min-height:48px;padding:4px;display:flex;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;background:var(--soft);border-radius:4px;margin-top:14px}
.chip{background:#fff;border:1px solid var(--ink);border-radius:4px;padding:7px 12px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left}
.chip.sel{background:var(--acc)}
.hs{position:relative;line-height:0}
.hs img{width:100%;border-radius:4px}
.hs-dot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--acc);border:3px solid #fff;font-weight:700;font-size:14px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:0}
.hs-dot.on{background:var(--ink);color:#fff}
.hs-detail{background:var(--soft);border-radius:4px;padding:14px 16px;margin-top:10px;min-height:56px}
.hs-detail h4{margin:0 0 4px}
.tl{list-style:none;margin:0;padding:0 0 0 26px;border-left:3px solid var(--line)}
.tl li{position:relative;padding-bottom:22px}.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-36px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 2px var(--acc)}
.tl small{display:block;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.tl h4{margin:0 0 4px;font-size:19px}
.proc{border:1px solid var(--line);border-radius:6px;padding:20px}
.proc .num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--acc);font-weight:800;margin-bottom:8px}
.proc h4{margin:0 0 6px;font-size:20px}
.proc-n{display:flex;align-items:center;gap:10px;margin-top:16px}
.proc-n span{flex:1;text-align:center;font-size:13px;color:var(--mut)}
.btn:disabled{opacity:.35;cursor:default}
.ph{border:2px dashed #a8a8a3;border-radius:6px;padding:26px;text-align:center;color:var(--mut);background:var(--soft)}
.result{border-radius:6px;padding:20px;background:var(--soft);border-left:6px solid var(--ink);margin-top:24px}
.result.pass{border-color:var(--ok)}.result.fail{border-color:var(--bad)}
.result b{font-size:24px;display:block}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.donebox{margin-top:26px;padding:16px 18px;background:#e9f5ee;border-left:6px solid var(--ok);border-radius:4px;font-weight:700}
@media(max-width:860px){
 .side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .25s;max-width:86vw}
 .app.open .side{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.5)}
 .mtop{display:flex}.lesson{padding:28px 18px 60px}.lesson>h2{font-size:27px}
 .mrow{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</script>

function load(){var raw='';if(S.api)raw=S.get('cmi.suspend_data');else if(!PREVIEW){try{raw=localStorage.getItem('kb_'+C.id)||'';}catch(e){}}

function ph(b){return PREVIEW?h('div',{class:'ph'},'🖼 '+(b.note||b.alt||'Medium fehlt')):null;}
function Q(b,ctx,build){
 var body=h('div',{class:'q-body'}),fb=h('div',{class:'q-fb',role:'status'}),card=h('div',{class:'q'},b.question?h('div',{class:'q-title',html:md(b.question)}):null,body,fb),api=build(body);
 function show(ok){card.classList.remove('ok','bad');card.classList.add(ok?'ok':'bad','done');fb.innerHTML='<strong>'+esc(t(ok?'correct':'wrong'))+'</strong> '+inline((ok?b.feedbackCorrect:b.feedbackWrong)||'');}

 else{var btn=h('button',{class:'btn',type:'button',onclick:function(){if(card.classList.contains('done')){reset();btn.textContent=t('check');}else{show(api.check());btn.textContent=t('retry');}}},t('check'));card.appendChild(h('div',{class:'q-actions'},btn));}

 return{check:function(){var ok=true;rows.forEach(function(r){var c=!!r.o.correct;if(r.inp.checked!==c)ok=false;r.lab.classList.toggle('right',r.inp.checked&&c);r.lab.classList.toggle('wrong',r.inp.checked&&!c);});return ok;}};});}

 list:function(b){var tag=b.style==='number'?'ol':'ul';return h(tag,{class:'lst '+(b.style||'')},(b.items||[]).map(function(x){return h('li',{html:inline(x)});}));},

 tabs:function(b){var items=b.items||[],list=h('div',{role:'tablist'}),panel=h('div',{role:'tabpanel'}),btns=[];
  function sel(i){btns.forEach(function(x,k){x.setAttribute('aria-selected',k===i?'true':'false');});panel.innerHTML=md(items[i].text);}
  items.forEach(function(it,i){var bt=h('button',{type:'button',role:'tab',onclick:function(){sel(i);}},it.title||'');btns.push(bt);list.appendChild(bt);});
  if(items.length)sel(0);return h('div',{class:'tabs'},list,panel);},
 flashcards:function(b){return h('div',{},h('p',{class:'hintp'},t('flipHint')),h('div',{class:'cards'},(b.items||[]).map(function(it){
  var c=h('button',{type:'button',class:'card3',onclick:function(){c.classList.toggle('flip');}},h('span',{},h('b',{html:inline(it.front)}),h('em',{html:inline(it.back).replace(/\n/g,'<br>')})));return c;})));},
 single_choice:function(b,ctx){return choice(b,ctx,false,b.options||[]);},
 multiple_choice:function(b,ctx){return choice(b,ctx,true,b.options||[]);},
 true_false:function(b,ctx){return choice(b,ctx,false,[{text:t('true'),correct:b.answer===true},{text:t('false'),correct:b.answer!==true}]);},
 fill_blank:function(b,ctx){return Q(b,ctx,function(body){var p=h('p',{class:'blank-text'}),ins=[];
  String(b.text||'').split(/\{\{(.*?)\}\}/).forEach(function(seg,i){if(i%2){var alts=seg.split('|').map(norm),inp=h('input',{type:'text',class:'blank',size:Math.max(6,seg.split('|')[0].length+2),autocomplete:'off','aria-label':'…'});ins.push({inp:inp,alts:alts});p.appendChild(inp);}
   else p.appendChild(h('span',{html:inline(seg).replace(/\n/g,'<br>')}));});
  body.appendChild(p);return{check:function(){var ok=true;ins.forEach(function(x){var g=x.alts.indexOf(norm(x.inp.value))>=0;x.inp.classList.toggle('right',g);x.inp.classList.toggle('wrong',!g);if(!g)ok=false;});return ok;}};});},
 sorting:function(b,ctx){return Q(b,ctx,function(body){var items=(b.items||[]).slice(),ord=shuffle(items),n=0;
  while(items.length>1&&ord.join('\u0001')===items.join('\u0001')&&n++<20)ord=shuffle(items);
  var ul=h('ul',{class:'sort'});
  ord.forEach(function(txt){var li=h('li',{tabIndex:0},h('span',{class:'grip','aria-hidden':'true'},'⠿'),h('span',{html:inline(txt)}));li._t=txt;
   li.addEventListener('keydown',function(e){if(e.key==='ArrowUp'&&li.previousElementSibling){ul.insertBefore(li,li.previousElementSibling);li.focus();e.preventDefault();}
    if(e.key==='ArrowDown'&&li.nextElementSibling){ul.insertBefore(li.nextElementSibling,li);li.focus();e.preventDefault();}});
   li.addEventListener('pointerdown',function(e){if(e.button||(e.pointerType==='touch'&&!e.target.closest('.grip')))return;e.preventDefault();li.classList.add('drag');
    function mv(ev){var sibs=[].slice.call(ul.children).filter(function(x){return x!==li;}),before=null;for(var k=0;k<sibs.length;k++){var r=sibs[k].getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=sibs[k];break;}}
     if(li.nextElementSibling!==before)ul.insertBefore(li,before);}
    function up(){li.classList.remove('drag');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);}
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);});
   ul.appendChild(li);});
  body.appendChild(h('p',{class:'hintp'},t('sortHint')));body.appendChild(ul);
  return{check:function(){var ok=true;[].forEach.call(ul.children,function(li,k){var g=li._t===items[k];li.classList.toggle('right',g);li.classList.toggle('wrong',!g);if(!g)ok=false;});return ok;}};});},
 matching:function(b,ctx){return Q(b,ctx,function(body){var pairs=b.pairs||[],pool=h('div',{class:'pool'}),rows=h('div',{}),sel=null;
  function pick(c){if(sel)sel.classList.remove('sel');sel=c;if(c)c.classList.add('sel');}
  function place(chip,target){if(target!==pool&&target.firstChild&&target.firstChild!==chip)pool.appendChild(target.firstChild);target.appendChild(chip);pick(null);}
  var slots=pairs.map(function(p){var slot=h('div',{class:'slot',tabIndex:0});slot._r=p.right;
   function go(){if(sel&&sel.parentNode!==slot)place(sel,slot);}
   slot.addEventListener('click',go);slot.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target===slot)go();});
   rows.appendChild(h('div',{class:'mrow'},h('div',{class:'mleft',html:inline(p.left)}),slot));return slot;});
  pool.addEventListener('click',function(e){if(e.target===pool&&sel)place(sel,pool);});
  shuffle(pairs.map(function(p){return p.right;})).forEach(function(txt){var chip=h('button',{type:'button',class:'chip'},txt);chip._t=txt;
   chip.addEventListener('click',function(e){if(e.detail===0){pick(sel===chip?null:chip);e.stopPropagation();}});
   chip.addEventListener('pointerdown',function(e){if(e.button)return;var sx=e.clientX,sy=e.clientY,drag=false,r=chip.getBoundingClientRect(),ox=sx-r.left,oy=sy-r.top;
    function mv(ev){if(!drag&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6){drag=true;chip.style.cssText='position:fixed;z-index:9;pointer-events:none;width:'+r.width+'px;box-shadow:0 6px 18px rgba(0,0,0,.25)';}
     if(drag){chip.style.left=(ev.clientX-ox)+'px';chip.style.top=(ev.clientY-oy)+'px';}}
    function up(ev){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
     if(drag){chip.style.cssText='';var el=document.elementFromPoint(ev.clientX,ev.clientY),tg=el&&el.closest('.slot,.pool');if(tg&&body.contains(tg))place(chip,tg);}
     else if(ev.type==='pointerup')pick(sel===chip?null:chip);}
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);});
   pool.appendChild(chip);});
  body.appendChild(h('p',{class:'hintp'},t('matchHint')));body.appendChild(rows);body.appendChild(pool);
  return{check:function(){var ok=true;slots.forEach(function(s){var g=!!s.firstChild&&s.firstChild._t===s._r;s.classList.toggle('right',g);s.classList.toggle('wrong',!g);if(!g)ok=false;});return ok;}};});},
 hotspot:function(b){if(!b.src)return ph(b);var det=h('div',{class:'hs-detail'},h('p',{class:'hintp'},t('hotspotHint'))),wrap=h('div',{class:'hs'},h('img',{src:b.src,alt:b.alt||''}));
  (b.spots||[]).forEach(function(s,i){var bt=h('button',{type:'button',class:'hs-dot',style:'left:'+s.x+'%;top:'+s.y+'%','aria-label':s.title||String(i+1),onclick:function(){
    [].forEach.call(wrap.querySelectorAll('.hs-dot'),function(d){d.classList.remove('on');});bt.classList.add('on');det.innerHTML='';det.appendChild(h('h4',{},s.title||''));det.appendChild(h('div',{html:md(s.text)}));}},String(i+1));wrap.appendChild(bt);});
  return h('div',{},wrap,det);},

var app,view,navBtns=[],bar,pct;
function progress(){var d=st.v.filter(Boolean).length,p=L.length?Math.round(d/L.length*100):0;bar.style.width=p+'%';pct.textContent=t('progress',{pct:p});

 bar=h('i',{});pct=h('div',{class:'pct'});

  h('div',{class:'mainw'},h('div',{class:'mtop'},h('button',{type:'button','aria-label':t('menu'),onclick:function(e){e.stopPropagation();app.classList.toggle('open');}},'☰'),h('span',{},C.title||'')),view));

function go(i){app.classList.remove('open');if(i<0||!L[i])cover();else lesson(i);view.scrollTop=0;persist();}
function cover(){st.loc=-1;view.innerHTML='';var first=st.v.some(Boolean)?Math.max(0,st.v.indexOf(0)):0;
 var c=h('div',{class:'cover'},h('div',{},h('h2',{},C.title||''),C.description?h('p',{},C.description):null,L.length?h('button',{class:'btn',type:'button',onclick:function(){go(first);}},t(st.v.some(Boolean)?'resume':'start')):null));
 if(C.cover)c.style.backgroundImage='url("'+C.cover+'")';view.appendChild(c);}
function lesson(i){st.loc=i;view.innerHTML='';var les=L[i],qs=[],isTest=TESTS.indexOf(i)>=0;
 var art=h('article',{class:'lesson'},h('p',{class:'kicker'},t('lessonOf',{n:i+1,total:L.length})),h('h2',{},les.title||''));
 (les.blocks||[]).forEach(function(b){var r=R[b.type];if(!r)return;var el=r(b,{test:isTest,qs:qs});if(el)art.appendChild(h('section',{class:'blk blk-'+b.type},el));});
 if(isTest){var res=h('div',{});
  var showRes=function(){var r=st.tests[i];if(!r)return;var sc=r[1]?Math.round(r[0]/r[1]*100):100,ok=sc>=(+C.passingScore||80);res.innerHTML='';
   res.appendChild(h('div',{class:'result '+(ok?'pass':'fail')},h('b',{},t('testResult',{score:sc})),h('span',{},ok?t('testPassed'):t('testFailed',{pass:+C.passingScore||80}))));};
  var sb=h('button',{class:'btn',type:'button',onclick:function(){
   if(sb._done){lesson(i);view.scrollTop=0;return;}
   var c=0;qs.forEach(function(q){var ok=q.check();q.show(ok);if(ok)c++;});st.tests[i]=[c,qs.length];st.v[i]=1;sb._done=true;sb.textContent=t('retryTest');showRes();persist();}},t('submitTest'));
  art.appendChild(h('div',{},sb));art.appendChild(res);showRes();}
 var foot=h('div',{class:'foot'},i>0?h('button',{class:'btn sec',type:'button',onclick:function(){go(i-1);}},t('back')):h('span',{}),
  i<L.length-1?h('button',{class:'btn',type:'button',onclick:function(){if(!isTest)st.v[i]=1;go(i+1);}},t('next')):h('span',{}));
 art.appendChild(h('div',{id:'donebox',class:'donebox',hidden:true},t('courseDone')));art.appendChild(foot);view.appendChild(art);
 if(!isTest){var mark=function(){if(!st.v[i]){st.v[i]=1;persist();}};
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){io.disconnect();if(st.loc===i)mark();}},{root:view});io.observe(foot);}else mark();}

S.init();load();shell();
if(typeof window.START==='number'&&L[window.START])go(window.START);else if(st.loc>=0&&L[st.loc])go(st.loc);else go(-1);

})();

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=-1;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0;}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 files.forEach(f=>{const n=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x800,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,n.length,true);
  parts.push(lh.buffer,n,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x800,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
  cen.push(ch.buffer,n);off+=30+n.length+sz;});
 let cs=0;cen.forEach(p=>cs+=p.byteLength);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});}
const EXT={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/svg+xml':'svg','image/webp':'webp','video/mp4':'mp4','video/webm':'webm','font/woff2':'woff2','font/woff':'woff','font/ttf':'ttf','font/otf':'otf'};
function dataToBytes(url){const m=url.match(/^data:([^;,]*)((?:;[^;,]*)*),([\s\S]*)$/);if(!m)return null;let bytes;
 if(/;base64/i.test(m[2])){const bin=atob(m[3]);bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);}else bytes=new TextEncoder().encode(decodeURIComponent(m[3]));
 return{bytes,ext:EXT[m[1]]||'bin'};}
function exportScorm(){const problems=[];if(!course.lessons.length)problems.push('Der Kurs hat keine Lektionen.');
 course.lessons.forEach(l=>{if(!l.blocks.length)problems.push('Lektion „'+l.title+'“ ist leer.');if(l.isTest&&!l.blocks.some(b=>QTYPES.includes(b.type)))problems.push('Abschlusstest „'+l.title+'“ enthält keine Fragen.');
  l.blocks.forEach(b=>{if((b.type==='image'||b.type==='video'||b.type==='hotspot')&&!b.src)problems.push('In „'+l.title+'“ fehlt bei einem Block ('+BLOCKS[b.type].l+') das Medium – er wird im Export ausgelassen.');
   if(b.type==='single_choice'&&(b.options||[]).filter(o=>o.correct).length!==1)problems.push('In „'+l.title+'“ hat eine Single-Choice-Frage nicht genau eine richtige Antwort.');
   if(b.type==='multiple_choice'&&!(b.options||[]).some(o=>o.correct))problems.push('In „'+l.title+'“ hat eine Multiple-Choice-Frage keine richtige Antwort.');
   if(b.type==='fill_blank'&&!/\{\{.+?\}\}/.test(b.text||''))problems.push('In „'+l.title+'“ enthält ein Lückentext keine {{Lücke}}.');});});
 if(problems.length&&!confirm('Vor dem Export bitte prüfen:\n\n• '+problems.slice(0,12).join('\n• ')+(problems.length>12?'\n• …':'')+'\n\nTrotzdem exportieren?'))return;
 const c=clone(course),files=[],seen=new Map();delete c.updated;
 (function walk(o){for(const k in o){const v=o[k];if(typeof v==='string'&&v.startsWith('data:')){if(!seen.has(v)){const d=dataToBytes(v);if(!d)continue;const name='media/m'+(seen.size+1)+'.'+d.ext;seen.set(v,name);files.push({name,data:d.bytes});}o[k]=seen.get(v);}else if(v&&typeof v==='object')walk(v);}})(c);
 c.lessons.forEach(l=>l.blocks.forEach(b=>{delete b.note;}));
 const hasTest=c.lessons.some(l=>l.isTest&&l.blocks.some(b=>QTYPES.includes(b.type))),enc=new TextEncoder();
 files.unshift({name:'index.html',data:enc.encode(buildPlayer(c,{preview:false}))});
 const manifest='<?xml version="1.0" encoding="UTF-8"?>\n<manifest identifier="kb_'+c.id+'" version="1.0" xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2" xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd http://www.imsglobal.org/xsd/imsmd_rootv1p2p1 imsmd_rootv1p2p1.xsd http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">\n'
  +' <metadata><schema>ADL SCORM</schema><schemaversion>1.2</schemaversion></metadata>\n <organizations default="org1">\n  <organization identifier="org1">\n   <title>'+escX(c.title)+'</title>\n   <item identifier="item1" identifierref="res1" isvisible="true">\n    <title>'+escX(c.title)+'</title>\n'
  +(hasTest?'    <adlcp:masteryscore>'+c.passingScore+'</adlcp:masteryscore>\n':'')+'   </item>\n  </organization>\n </organizations>\n <resources>\n  <resource identifier="res1" type="webcontent" adlcp:scormtype="sco" href="index.html">\n'
  +files.map(f=>'   <file href="'+escX(f.name)+'"/>').join('\n')+'\n  </resource>\n </resources>\n</manifest>\n';
 files.unshift({name:'imsmanifest.xml',data:enc.encode(manifest)});
 download(zip(files),slug(c.title)+'_'+slug(c.lang)+'_scorm12.zip');}
