<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Graphics Editor</title>
<style>
:root{--bg:#111113;--panel:#18181b;--panel2:#202024;--panel3:#2a2a2f;--line:#28282d;--line2:#36363c;--text:#ececef;--muted:#8f8f99;--faint:#5f5f68;--accent:#F37A1F;--accent2:#FF9142;--accentbg:rgba(243,122,31,.16);--accentln:rgba(243,122,31,.55);--ok:#4fbf7a;--bad:#e5604d;--warn:#e8b04a;--r:10px;--lw:290px;--rw:330px;--th:230px;
  --uifont:"STIHL Contraface Text","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--uifont);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2e2e34;border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:#3b3b42}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
#app{position:relative;display:grid;height:100vh;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);grid-template-rows:52px minmax(0,1fr) var(--th);grid-template-areas:"top top top" "left mid right" "tl tl tl"}

/* Kopfzeile */
header{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-size:14px;font-weight:600;width:200px;min-width:80px}
.pname:hover{border-color:var(--line2)}.pname:focus{outline:none;border-color:var(--accent);background:var(--bg)}
#dirty{color:var(--faint);font-size:12px;white-space:nowrap}
.vsep{width:1px;height:24px;background:var(--line2);margin:0 4px;flex:none}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;line-height:1.2;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3);border-color:#46464d}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--panel2);border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.icon{padding:6px}
.btn.on{background:var(--accentbg);border-color:var(--accent);color:var(--accent2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:5px 10px 5px 9px;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:#4a4a52}.pill b{font-weight:600}.pill .ic.c{width:12px;height:12px;color:var(--muted)}
.pill small{color:var(--muted)}
#lblFormat,#lblLangWarn{display:inline-flex;align-items:center;gap:6px}
#lblUiLang{font-size:11px;font-weight:700;color:var(--muted)}

/* Menüs */
.menu{position:fixed;z-index:100;min-width:240px;max-width:340px;max-height:calc(100vh - 70px);overflow:auto;background:#1e1e22;border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.mi:hover{background:var(--panel3)}
.mi .grow{flex:1;min-width:0}.mi small{display:block;color:var(--muted);font-size:11.5px}
.mi .ck{color:var(--accent);width:16px}
.mi .lc{width:24px;font-size:11px;font-weight:700;color:var(--muted)}
.mi .badge{font-size:11px;color:var(--warn);border:1px solid rgba(232,176,74,.4);border-radius:999px;padding:0 6px}
.mscroll{max-height:min(46vh,420px);overflow:auto}
.mscroll .mi{padding:6px 10px}
.mhead{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;padding:8px 10px 4px}
.msep{height:1px;background:var(--line2);margin:5px 4px}
.ratio{border:2px solid var(--muted);border-radius:3px;flex:none}

/* Seitenleisten */
aside{background:var(--panel);overflow:auto;min-width:0}
#left{grid-area:left;border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{grid-area:right;border-left:1px solid var(--line);padding:14px}
.tabs{display:flex;gap:2px;padding:10px 8px 0;position:sticky;top:0;background:var(--panel);z-index:3;border-bottom:1px solid var(--line)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px 8px;color:var(--muted);cursor:pointer;font-weight:500;font-size:11.5px}
.tab span.tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-bottom-color:var(--accent)}
#leftBody{padding:12px;flex:1}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:18px 0 8px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:6px}
h3:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.item:hover{background:var(--panel2)}
.item.on{background:var(--accentbg);border-color:var(--accentln)}
.item .n{color:var(--muted);width:16px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
.item .sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.item .ic{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.tag{font-size:10.5px;color:var(--muted);background:var(--panel3);border-radius:5px;padding:1px 6px;text-transform:none;letter-spacing:0;font-weight:500;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.iconrow{display:flex;gap:4px;margin-top:8px}
.addrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.addrow .btn{flex-direction:column;gap:3px;padding:8px 4px;font-size:11.5px;justify-content:center}
.empty{color:var(--muted);font-size:12px;padding:10px;text-align:center;border:1px dashed var(--line2);border-radius:9px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:10px}
.card .ttl{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:2px}
.card .meta{color:var(--muted);font-size:12px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line2);border-radius:var(--r);padding:16px 10px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .12s,background .12s;font-size:12px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accentbg);color:var(--text)}
.drop .ic{width:22px;height:22px;color:var(--accent)}
.drop b{color:var(--text);font-weight:600;font-size:13px}

/* Formularfelder */
.f{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.f>span{color:var(--muted);font-size:12px}
.f.full{grid-template-columns:1fr}
.f input[type=text],.f input[type=number],.f select,.f textarea,.search{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;min-width:0}
.f textarea{min-height:80px;resize:vertical;line-height:1.4}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.f input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none;cursor:pointer}
.fontrow{display:flex;gap:6px;min-width:0}.fontrow select{flex:1}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line2)}
.chip.on{border-color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.row2 .f{grid-template-columns:1fr;gap:3px}
.fs{font-size:11px;margin:-4px 0 8px 108px}.fs.ok{color:var(--ok)}.fs.bad{color:var(--bad)}
.ffile{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:5px}
.ffile span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.rg{display:flex;align-items:center;gap:8px}.rg output{min-width:36px;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sl{margin-top:10px}.sl label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:2px}.sl label b{color:var(--text);font-weight:500}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0;line-height:1.5}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.orig{font-size:12px;color:var(--muted);background:var(--bg);border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;margin:-2px 0 8px;white-space:pre-wrap}
.ihead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ihead .badge{display:inline-flex;align-items:center;gap:6px;background:var(--accentbg);color:var(--accent2);border-radius:8px;padding:4px 9px;font-weight:600}
.ihead .sp{flex:1}
.grpnote{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:6px 9px;margin-bottom:10px}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
details>summary{cursor:pointer;color:var(--text);font-size:12.5px;font-weight:500;padding:8px 0;list-style:none;user-select:none;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary .ic{width:14px;height:14px;color:var(--muted);transition:transform .15s;transform:rotate(-90deg)}
details[open]>summary .ic{transform:none}
details>summary:hover{color:var(--accent2)}
details .secb{padding:4px 0 4px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;background:none;border:0;border-radius:6px;padding:4px 6px;cursor:pointer;color:var(--muted);font-size:12px}
.seg button.on{background:var(--panel3);color:var(--text)}

/* Bausteine & Icons */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px;cursor:pointer;text-align:left;transition:border-color .12s,transform .12s}
.bcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.bcard svg{width:100%;display:block;border-radius:6px;background:#0c0c0e}
.bcard b{display:block;font-size:12px;font-weight:600;margin:6px 2px 0}
.bcard small{display:block;color:var(--muted);font-size:11px;margin:0 2px 2px;line-height:1.35}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.icard{background:#e9e9ec;border:2px solid transparent;border-radius:9px;padding:8px;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;position:relative}
.icard:hover{border-color:var(--accent)}
.icard img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.icard i{position:absolute;left:0;right:0;bottom:-1px;font-style:normal;font-size:9.5px;color:#55555c;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.search{margin-bottom:10px}

/* Bühne */
#mid{grid-area:mid;display:flex;flex-direction:column;min-width:0;min-height:0}
#view{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:radial-gradient(circle at 50% 40%,#1a1a1e,#0d0d0f);position:relative;overflow:hidden}
#view:fullscreen{background:#000}
#stagebox{position:relative;box-shadow:0 10px 50px rgba(0,0,0,.6);border-radius:4px;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
#fmtTag{position:absolute;left:12px;top:10px;font-size:11px;color:var(--faint);pointer-events:none}
#transport{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
#bPlay{width:38px;height:38px;flex:none;justify-content:center;border-radius:50%;padding:0}
#time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:170px;margin-left:6px}
#time b{color:var(--text);font-weight:500}
#status{color:var(--muted);font-size:12px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .2s}

/* Zeitleiste */
#tl{grid-area:tl;border-top:1px solid var(--line);background:var(--panel);position:relative;overflow:auto;user-select:none}
.trow{display:flex;height:30px;align-items:stretch;border-bottom:1px solid var(--line)}
.trow.sc{height:34px}
.lab{width:150px;flex:none;padding:0 10px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line);position:sticky;left:0;background:var(--panel);z-index:4;display:flex;align-items:center;gap:7px}
.lab .ic{width:14px;height:14px}
.trk{flex:1;position:relative;overflow:hidden}
.blk{position:absolute;top:4px;bottom:4px;border-radius:7px;background:var(--panel3);border:1px solid var(--line2);padding:0 8px;overflow:hidden;white-space:nowrap;font-size:12px;cursor:pointer;line-height:24px}
.blk.on{background:rgba(243,122,31,.25);border-color:var(--accent)}
.blk .tri{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px;background:var(--accent2);opacity:.8}
.hdl{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;cursor:ew-resize;z-index:3}
.hdl:after{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--faint)}
.hdl:hover:after{background:var(--accent)}
.bar{position:absolute;top:5px;bottom:5px;border-radius:6px;background:#3a3a41;border:1px solid #4a4a52;cursor:grab;font-size:11px;line-height:18px;padding:0 9px;overflow:hidden;white-space:nowrap;color:#d6d6dc}
.bar:hover{border-color:#6a6a74}
.bar.on{background:var(--accent);border-color:var(--accent2);color:#fff}
.bar .bh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar .bh.l{left:0}.bar .bh.r{right:0}
.bar:hover .bh{background:rgba(255,255,255,.18)}
.cue{position:absolute;top:5px;bottom:5px;border-radius:5px;background:rgba(120,150,255,.22);border:1px solid rgba(120,150,255,.5);font-size:11px;line-height:18px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:pointer;color:#cfd8ff}
.cue.miss{background:rgba(232,176,74,.15);border-color:rgba(232,176,74,.5);color:var(--warn)}
.span{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.035)}
.wave{position:absolute;top:0;height:100%}
#tlin{position:relative;min-height:100%}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:5}
#ph:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--accent)}

/* Teiler */
.split{position:absolute;z-index:20;background:transparent;transition:background .12s}
.split:hover,.split.on{background:var(--accent)}
.split.v{top:52px;bottom:var(--th);width:5px;cursor:col-resize}
.split.h{left:0;right:0;height:5px;cursor:row-resize}
#spL{left:calc(var(--lw) - 3px)}#spR{right:calc(var(--rw) - 3px)}#spT{bottom:calc(var(--th) - 3px)}

/* Dialoge, Toasts, Drop */
dialog{background:#1b1b1f;color:var(--text);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(760px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(2px)}
dialog h2{margin:0 0 6px;font-size:17px}
dialog textarea{width:100%;height:330px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px;font:12px/1.45 Consolas,"Cascadia Mono",monospace;resize:vertical;margin-top:10px}
dialog .acts{justify-content:flex-end;margin-top:16px}
#dAsk{width:min(440px,92vw)}
#daMsg{margin:0;line-height:1.5;white-space:pre-wrap}
#daInput{width:100%;margin-top:12px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
#daInput:focus{outline:none;border-color:var(--accent)}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2)}
.lrow .code{font-weight:700;width:44px}
.lrow .grow{flex:1;color:var(--muted);font-size:12px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.addline{display:flex;gap:8px;margin-top:12px}
.addline input{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 9px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;margin-top:8px}
.keys kbd{background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font:12px Consolas,monospace;white-space:nowrap;justify-self:start}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:400;pointer-events:none}
.toast{background:#26262b;border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;max-width:380px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .2s ease-out}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#dropov{position:fixed;inset:0;z-index:150;background:rgba(17,17,19,.78);display:none;align-items:center;justify-content:center;pointer-events:none}
#dropov.on{display:flex}
#dropov div{border:2px dashed var(--accent);border-radius:20px;padding:40px 60px;text-align:center;font-size:16px;background:var(--accentbg)}
#dropov small{display:block;color:var(--muted);font-size:13px;margin-top:6px}

/* Tour */
#tour{position:fixed;inset:0;z-index:300;display:none}
#tour.on{display:block}
#tourHole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.62);border:2px solid var(--accent);transition:all .25s ease;pointer-events:none}
#tourPop{position:fixed;width:340px;max-width:calc(100vw - 24px);background:#1e1e22;border:1px solid var(--line2);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:top .25s ease,left .25s ease}
#tourPop.wide{width:460px}
.tlangs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:12px}
.tlangs .btn{justify-content:flex-start;padding:5px 7px;font-size:11.5px;overflow:hidden}
.tlangs .btn b{font-size:10.5px;color:var(--muted);min-width:18px}
#tourPop h4{margin:0 0 6px;font-size:15px}
#tourPop p{margin:0;color:#c9c9d0;line-height:1.5}
#tourPop .tacts{display:flex;align-items:center;gap:6px;margin-top:14px}
#tourPop .tstep{color:var(--faint);font-size:12px;flex:1}
#tourPop .tbar{height:3px;background:var(--line2);border-radius:3px;margin-top:14px;overflow:hidden}
#tourPop .tbar i{display:block;height:100%;background:var(--accent);transition:width .25s}

@media (max-width:1350px){.pill small,#dirty{display:none}.pname{width:150px}}

<body>
<div id="app">
  <header>
    <div class="logo"><svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></div>
    <input id="projName" class="pname" spellcheck="false" data-i18n-title="title_projName">
    <span id="dirty"></span>
    <div class="vsep"></div>
    <button class="pill" data-menu="format" data-i18n-title="title_format"><span id="lblFormat"></span></button>
    <button class="pill" data-menu="lang" data-i18n-title="title_lang"><span data-ic="globe"></span><b id="lblLang">DE</b><span id="lblLangWarn"></span></button>
    <span class="sp"></span>
    <button class="btn ghost icon" id="bUndo" data-i18n-title="title_undo" data-ic="undo"></button>
    <button class="btn ghost icon" id="bRedo" data-i18n-title="title_redo" data-ic="redo"></button>
    <div class="vsep"></div>
    <button class="btn ghost" data-menu="file" data-ic="file" data-i18n="m_file"></button>
    <button class="btn ghost" data-menu="copilot" data-ic="spark" data-i18n="copilot"></button>
    <button class="btn" id="bFull" data-ic="full" data-i18n="b_preview"></button>
    <button class="btn primary" id="bVideo" data-ic="download" data-i18n="b_export"></button>
    <button class="btn ghost" id="bFeedback" data-ic="mail" data-i18n="fb_btn"></button>
    <button class="btn ghost" data-menu="settings" data-i18n-title="title_settings"><span data-ic="gear"></span><span id="lblUiLang"></span></button>
  </header>

  <aside id="left">
    <nav class="tabs">
      <button class="tab" data-tab="scenes" data-tic="scenes" data-i18n="tab_scenes"></button>
      <button class="tab" data-tab="media" data-tic="music" data-i18n="tab_media"></button>
      <button class="tab" data-tab="blocks" data-tic="blocks" data-i18n="tab_blocks"></button>
      <button class="tab" data-tab="icons" data-tic="shapes" data-i18n="tab_icons"></button>
    </nav>
    <div id="leftBody"></div>
  </aside>

  <section id="mid">
    <div id="view"><span id="fmtTag"></span><div id="stagebox"><canvas id="cv" width="1920" height="1080"></canvas></div></div>
    <div id="transport" style="position:relative">
      <button class="btn primary" id="bPlay" data-i18n-title="title_play"></button>
      <button class="btn ghost icon" id="bStart" data-i18n-title="title_start" data-ic="start"></button>
      <span id="time"></span>
      <span id="status"></span>
      <button class="btn ghost icon" id="tlZoomOut" data-i18n-title="title_zoomOut" data-ic="zoomout"></button><span id="tlZoomLbl" style="font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums"></span><button class="btn ghost icon" id="tlZoomIn" data-i18n-title="title_zoomIn" data-ic="zoomin"></button><button class="btn ghost icon" id="tlZoomFit" data-i18n-title="title_zoomFit" data-ic="fitw"></button>
      <div class="vsep"></div>
      <button class="btn ghost icon" id="tLoop" data-i18n-title="title_loop" data-ic="loop"></button>
      <button class="btn ghost icon" id="tSound" data-i18n-title="title_sound"></button>
      <button class="btn ghost icon" id="tGuides" data-i18n-title="title_guides" data-ic="grid"></button>
      <button class="btn ghost icon" id="tSnap" data-i18n-title="title_snap" data-ic="magnet"></button>
      <div id="prog"></div>
    </div>
  </section>

  <aside id="right"></aside>
  <div id="tl"></div>
  <div class="split v" id="spL" data-i18n-title="title_split"></div>
  <div class="split v" id="spR" data-i18n-title="title_split"></div>
  <div class="split h" id="spT" data-i18n-title="title_split"></div>
</div>

<div id="menu" class="menu" hidden></div>
<div id="toasts"></div>
<div id="dropov"><div><span data-i18n="dropTitle"></span><small data-i18n="dropSub"></small></div></div>
<div id="tour"><div id="tourHole"></div><div id="tourPop"></div></div>

<dialog id="dText">
  <h2 id="dtTitle"></h2>
  <p class="hint" id="dtHint"></p>
  <textarea id="dtArea" spellcheck="false"></textarea>
  <div class="acts" id="dtActs"></div>
</dialog>
<dialog id="dPanel">
  <h2 id="dpTitle"></h2>
  <div id="dpBody"></div>
  <div class="acts" id="dpActs"></div>
</dialog>
<dialog id="dAsk">
  <p id="daMsg"></p>
  <input id="daInput" type="text" hidden>
  <div class="acts"><button class="btn" id="daNo"></button><button class="btn primary" id="daOk"></button></div>
</dialog>

<input type="file" id="fBroll" accept="video/*,.mp4,.mov,.webm" multiple hidden>

/* Speichern: lokal per Download-Link, in der claude.ai-Ansicht über die Downloads-Freigabe */
const inClaude=!!(window.claude&&typeof window.claude.use==="function");
const framed=(()=>{try{return window.top!==window.self;}catch(e){return true;}})();
let dlCap=null;
const dlReady=inClaude?window.claude.use("downloads").then(d=>{dlCap=d;}).catch(()=>{dlCap=null;}):Promise.resolve();
async function download(blob,name){
  if(inClaude){
    await dlReady;
    if(dlCap){
      try{await dlCap.save({filename:name,data:blob});return true;}
      catch(e){const c=e&&e.code;
        if(c==="declined")return false;
        if(c==="rejected_extension"||c==="extension_not_enabled"){toast(L("t_dlExt",name),"bad");return false;}
        if(c==="rate_limited"){toast(L("t_dlBusy"),"bad");return false;}
        if(c==="too_large"){toast(L("t_dlLarge"),"bad");return false;}
        if(framed){toast(L("t_dlBlocked"),"bad");return false;}}
    }else if(framed){toast(L("t_dlBlocked"),"bad");return false;}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);return true;
}
const srtFile=n=>inClaude&&framed?n+".txt":n;

function ask(msg,o){o=o||{};return new Promise(res=>{
  const d=$("#dAsk"),inp=$("#daInput"),ok=$("#daOk"),no=$("#daNo");let done=false;
  $("#daMsg").textContent=msg;inp.hidden=!o.input;inp.value=o.value||"";inp.placeholder=o.ph||"";
  ok.textContent=o.ok||L("ok");ok.className="btn "+(o.danger?"dangerfill":"primary");no.textContent=L("cancel");
  const fin=v=>{if(done)return;done=true;if(d.open)d.close();res(v);};
  ok.onclick=()=>fin(o.input?(inp.value.trim()||null):true);no.onclick=()=>fin(o.input?null:false);
  d.onclose=()=>fin(o.input?null:false);inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ok.click();}};
  openDlg(d);setTimeout(()=>(o.input?inp:ok).focus(),30);
});}

/* ---------- Animation ---------- */

      case"slide-down":r.o=c01(ep*1.5);r.dy=-d;break;
      case"slide-left":r.o=c01(ep*1.5);r.dx=d*2;break;
      case"slide-right":r.o=c01(ep*1.5);r.dx=-d*2;break;
      case"scale":r.o=c01(ep*2);r.s=.6+.4*ep;break;

  return s.replace(raw,(val*k).toLocaleString("de-DE",{minimumFractionDigits:dec,maximumFractionDigits:dec}));}

const WIN=.02;
function getCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function graph(){const c=getCtx();if(!AG){AG={bus:c.createGain(),mon:c.createGain(),rec:c.createMediaStreamDestination()};AG.bus.connect(AG.mon);AG.mon.connect(c.destination);AG.bus.connect(AG.rec);AG.mon.gain.value=UI.sound?1:0;}return AG;}
async function openEl(file){
  const el=document.createElement("video");el.playsInline=true;el.preload="auto";const url=URL.createObjectURL(file);el.src=url;
  try{await new Promise((res,rej)=>{el.onloadedmetadata=res;el.onerror=()=>rej(new Error("format"));});}
  catch(e){URL.revokeObjectURL(url);throw e;}
  return{el,url};
}
async function envelope(file){
  try{const buf=await getCtx().decodeAudioData(await file.arrayBuffer());
    const ch=buf.getChannelData(0),n=Math.floor(buf.duration/WIN),step=Math.floor(buf.sampleRate*WIN),env=new Float32Array(n);
    for(let k=0;k<n;k++){let s=0;for(let j=k*step;j<(k+1)*step;j++)s+=ch[j]*ch[j];env[k]=Math.sqrt(s/step);}return env;}catch(e){return null;}
}
async function loadMedia(file,restoring){
  dropMedia(true);toast(L("t_mediaLoading"));
  let o;try{o=await openEl(file);}catch(e){toast(L("t_mediaBad"),"bad");return;}
  const el=o.el;Object.assign(media,{el,url:o.url,name:file.name,file,dur:el.duration,hasVideo:el.videoWidth>0});
  media.src=getCtx().createMediaElementSource(el);media.src.connect(graph().bus);
  el.onseeked=()=>{if(!playing)renderStage();};
  media.env=await envelope(file);
  if(media.hasVideo&&!restoring)P.scenes.forEach(s=>s.showMedia=true);
  detectPauses();if(!restoring){autoFit(file.name);commit();}
  refreshAll();setT(0);toast(L("t_mediaOk",L(media.hasVideo?"video":"audio"),file.name),"ok");
}
function dropMedia(silent){
  if(playing)stopPlay();
  if(media.el){try{media.el.pause();}catch(e){}try{media.src&&media.src.disconnect();}catch(e){}if(media.url)URL.revokeObjectURL(media.url);}
  Object.assign(media,{el:null,url:null,name:"",file:null,hasVideo:false,dur:0,env:null,pauses:[],speech:null,src:null,cutMsg:""});
  if(!silent)refreshAll();
}
async function loadMusic(file){
  dropMusic(true);
  let o;try{o=await openEl(file);}catch(e){toast(L("t_musicBad"),"bad");return;}
  const c=getCtx();Object.assign(music,{el:o.el,url:o.url,name:file.name,file,dur:o.el.duration});
  music.src=c.createMediaElementSource(o.el);music.vol=c.createGain();music.duck=c.createGain();
  music.src.connect(music.vol);music.vol.connect(music.duck);music.duck.connect(graph().bus);
  applyMusicVol();music.env=await envelope(file);refreshAll();toast(L("t_musicOk",file.name),"ok");
}
function dropMusic(silent){
  if(music.el){try{music.el.pause();}catch(e){}try{music.src.disconnect();music.vol.disconnect();music.duck.disconnect();}catch(e){}URL.revokeObjectURL(music.url);}
  Object.assign(music,{el:null,url:null,name:"",file:null,dur:0,env:null,src:null,vol:null,duck:null});
  if(!silent)refreshAll();
}
function applyMusicVol(){if(music.vol)music.vol.gain.value=P.music.on?P.music.vol:0;}
function speechAt(tt){if(!media.speech)return false;const i=Math.floor(tt/WIN);return i>=0&&i<media.speech.length&&media.speech[i]===1;}
function musicGain(tt){const m=P.music;let g=1;if(m.fadeIn>0&&tt<m.fadeIn)g*=c01(tt/m.fadeIn);const end=total();if(m.fadeOut>0&&end-tt<m.fadeOut)g*=c01((end-tt)/m.fadeOut);if(speechAt(tt))g*=1-m.duck;return g;}
function musicTime(tt){if(!music.el)return null;if(P.music.loop)return tt%music.dur;return tt<music.dur?tt:null;}
function syncMusic(force){
  if(!music.el)return;const mt=musicTime(t),go=playing&&mt!=null;
  if(go){if(force||Math.abs(music.el.currentTime-mt)>.3){try{music.el.currentTime=mt;}catch(e){}}if(music.el.paused)music.el.play().catch(()=>{});}
  else if(!music.el.paused)music.el.pause();
  if(music.duck)music.duck.gain.setTargetAtTime(musicGain(t),getCtx().currentTime,force?.001:.07);
}
function detectPauses(){
  media.pauses=[];media.speech=null;const env=media.env;if(!env)return;
  const thr=+UI.thr,minP=+UI.minP/1000,db=new Float32Array(env.length);let peak=-1e9;
  for(let k=0;k<env.length;k++){db[k]=20*Math.log10(env[k]+1e-9);if(db[k]>peak)peak=db[k];}
  const lim=peak+thr;let run=-1;
  for(let k=0;k<=db.length;k++){
    const silent=k<db.length&&db[k]<lim;
    if(silent&&run<0)run=k;
    if(!silent&&run>=0){const a=run*WIN,b=k*WIN;if(run>0&&k<db.length&&b-a>=minP)media.pauses.push({a,b,len:b-a});run=-1;}
  }
  const sp=new Uint8Array(db.length),D=10;
  for(let k=0;k<db.length;k++)if(db[k]>=lim)for(let j=Math.max(0,k-D);j<=Math.min(db.length-1,k+D);j++)sp[j]=1;
  media.speech=sp;
}
function applyCuts(){
  if(!media.env){toast(L("t_noAnalysis"),"bad");return;}
  detectPauses();
  const N=P.scenes.length,need=N-1;if(!need)return;
  const Tn=media.dur+(+UI.tail),cutOf=p=>p.b-Math.min(.2,p.len/2);
  let cuts,msg;
  if(media.pauses.length>=need){
    cuts=media.pauses.slice().sort((x,y)=>y.len-x.len).slice(0,need).map(cutOf).sort((x,y)=>x-y);
    msg=`<span class="ok">${esc(L("cut_ok",need))}</span>`;
  }else{
    const f=media.dur/total();let acc=0;
    const prop=P.scenes.map(s=>{const st=acc;acc+=s.duration*f;return st;}).slice(1);
    cuts=prop.map(s=>{let best=null;media.pauses.forEach(p=>{const d=Math.abs(cutOf(p)-s);if(d<1.5&&(!best||d<best.d))best={d,v:cutOf(p)};});return best?best.v:s;});
    msg=`<span class="warn">${esc(L("cut_part",media.pauses.length,need))}</span>`;
  }
  const starts=[0,...cuts];
  for(let i=1;i<N;i++)if(starts[i]<starts[i-1]+.5)starts[i]=starts[i-1]+.5;
  for(let i=0;i<N;i++){const e=i<N-1?starts[i+1]:Math.max(Tn,starts[i]+.5);P.scenes[i].duration=+(e-starts[i]).toFixed(3);}
  media.cutMsg=msg;commit();refreshAll();
}
function autoFit(name){if(!media.dur)return;const f=(media.dur+(+UI.tail))/total();P.scenes.forEach(s=>s.duration=Math.max(.5,+(s.duration*f).toFixed(3)));toast(L("t_autoFit",name,total().toFixed(1)),"ok");}
function fitToMedia(){if(!media.el)return;const f=(media.dur+(+UI.tail))/total();P.scenes.forEach(s=>s.duration=Math.max(.5,+(s.duration*f).toFixed(3)));commit();refreshAll();}

/* ---------- B-Roll (lokale Clips, Ausschnitt im Video) ---------- */
const BR={},VIDS={};
const clipLen=e=>Math.max(.1,e.out-e.in);
const barLen=e=>e.type==="broll"?clipLen(e):e.dur;
const brollActive=(e,lt)=>{const r=lt-e.start;return r>=0&&r<clipLen(e);};
async function registerBroll(file,id){
  const o=await openEl(file);
  if(BR[id]&&BR[id].url)URL.revokeObjectURL(BR[id].url);
  BR[id]={file,url:o.url,dur:o.el.duration||0,name:file.name};
  const m=P.brolls.find(b=>b.id===id);if(m){m.name=file.name;m.dur=BR[id].dur;}else P.brolls.push({id,name:file.name,dur:BR[id].dur});
  for(const k in VIDS)if(VIDS[k].src===id){try{VIDS[k].el.pause();VIDS[k].node&&VIDS[k].node.disconnect();}catch(x){}delete VIDS[k];}
}
async function addBrolls(files,relinkId){
  let n=0;
  for(const f of files){try{await registerBroll(f,relinkId||uid());n++;toast(L("t_brollLoaded",f.name),"ok");}catch(e){toast(L("t_brollBad"),"bad");}if(relinkId)break;}
  if(n){commit();refreshAll();}
}
function bv(e){
  const b=BR[e.src];if(!b)return null;let v=VIDS[e.id];if(v&&v.src===e.src&&v.url===b.url)return v;
  if(v){try{v.el.pause();v.node&&v.node.disconnect();}catch(x){}}
  const el=document.createElement("video");el.src=b.url;el.preload="auto";el.playsInline=true;
  v={el,src:e.src,url:b.url,gain:null,node:null};
  try{const c=getCtx();v.node=c.createMediaElementSource(el);v.gain=c.createGain();v.gain.gain.value=0;v.node.connect(v.gain);v.gain.connect(graph().bus);}catch(x){el.muted=true;}
  el.onseeked=el.onloadeddata=()=>{if(!playing)renderStage();};
  VIDS[e.id]=v;return v;
}
function syncBrolls(){
  if(!P.brolls.length)return;
  const Lc=locate(t),s=P.scenes[Lc.i],act=new Set();
  s.elements.forEach(e=>{
    if(e.type!=="broll"||!brollActive(e,Lc.lt))return;const v=bv(e);if(!v)return;act.add(e.id);
    const st=Math.min(e.in+(Lc.lt-e.start),Math.max(0,(BR[e.src].dur||1e9)-.05));
    if(v.gain)v.gain.gain.value=e.sound?e.vol:0;
    if(playing){if(Math.abs(v.el.currentTime-st)>.3)v.el.currentTime=st;if(v.el.paused)v.el.play().catch(()=>{});}
    else{if(!v.el.paused)v.el.pause();if(!v.el.seeking&&Math.abs(v.el.currentTime-st)>.04)v.el.currentTime=st;}
  });
  for(const id in VIDS){if(!act.has(id)&&!VIDS[id].el.paused)VIDS[id].el.pause();}
}

function parseTime(s){const m=s.match(/(?:(\d+):)?(\d{1,2}):(\d{2})[,.](\d{1,3})/);if(!m)return NaN;return(+(m[1]||0))*3600+(+m[2])*60+(+m[3])+(+m[4].padEnd(3,"0"))/1000;}
function parseSubs(text){
  const out=[];String(text).replace(/\r/g,"").replace(/^﻿/,"").split(/\n\s*\n/).forEach(b=>{
    const lines=b.split("\n").filter(l=>l.trim()!=="");const ti=lines.findIndex(l=>l.includes("-->"));if(ti<0)return;
    const [x,y]=lines[ti].split("-->");const a=parseTime(x),bb=parseTime(y);if(!isFinite(a)||!isFinite(bb))return;
    const tx=lines.slice(ti+1).join("\n").replace(/<[^>]+>/g,"").trim();out.push({a,b:bb,text:tx});
  });return out.sort((p,q)=>p.a-q.a);
}
function srtTime(x){const ms=Math.round(x*1000),h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms%1000).padStart(3,"0")}`;}
function toSRT(l){return P.subs.map((c,i)=>`${i+1}\n${srtTime(c.a)} --> ${srtTime(c.b)}\n${l===baseLang()?c.text:(c.tr[l]||"")}\n`).join("\n");}
const overlap=(p,q)=>Math.max(0,Math.min(p.b,q.b)-Math.max(p.a,q.a));
function applySubs(text,l){
  const cues=parseSubs(text);if(!cues.length)throw new Error(L("e_noSubs"));
  if(l===baseLang()||!P.subs.length){
    const old=P.subs;
    P.subs=cues.map(c=>{let best=null,bo=0;old.forEach(o=>{const v=overlap(o,c);if(v>bo){bo=v;best=o;}});return normCue({a:c.a,b:c.b,text:c.text,tr:best?best.tr:{},...(l!==baseLang()?{tr:{[l]:c.text}}:{})});});
    if(l!==baseLang())toast(L("t_subsTimes",baseLang(),l));
  }else{
    let n=0;P.subs.forEach(b=>{let best=null,bo=0;cues.forEach(c=>{const v=overlap(b,c);if(v>bo){bo=v;best=c;}});if(best){b.tr[l]=best.text;n++;}});
    if(n<P.subs.length)toast(L("t_subsNoMatch",P.subs.length-n,l),"bad");
  }
  P.subStyle.on=true;commit();refreshAll();return cues.length;
}
function subsDialog(){

/* ---------- Übersetzungstabelle (CSV) ---------- */
const csvCell=s=>{s=String(s==null?"":s);return /[";\n\r,]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function buildCSV(){
  const rows=[["ID","Scene","Type",...P.langs]];
  P.scenes.forEach((s,i)=>s.elements.forEach(e=>{if(e.type==="text"&&translatable(e))rows.push([e.id,`${i+1} ${s.name}`,"Text",...P.langs.map((l,j)=>j===0?e.text:(e.tr[l]||""))]);}));
  P.subs.forEach(c=>rows.push([c.id,srtTime(c.a),"Subtitle",...P.langs.map((l,j)=>j===0?c.text:(c.tr[l]||""))]));
  return rows.map(r=>r.map(csvCell).join(";")).join("\r\n");
}
async function exportCSV(){if(P.langs.length<2)toast(L("t_csvTip"));if(await download(new Blob(["﻿"+buildCSV()],{type:"text/csv;charset=utf-8"}),`${safeName(P.name)}_translation.csv`))toast(L("t_csvSaved"),"ok");}
function parseCSV(text){
  text=String(text).replace(/^﻿/,"").trim().replace(/^```[a-z]*\n?/i,"").replace(/```\s*$/,"");
  const first=text.split("\n")[0],d=[";","\t",","].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error(L("e_csvEmpty"));
  const head=rows[0].map(h=>h.trim().toUpperCase());const cols=[];
  head.forEach((h,i)=>{if(i>=3&&/^[A-Z]{2,3}(-[A-Z]{2})?$/.test(h))cols.push([i,h]);});
  if(!cols.length)throw new Error(L("e_csvNoLang"));
  const map={};P.scenes.forEach(s=>s.elements.forEach(e=>map[e.id]=e));P.subs.forEach(c=>map[c.id]=c);
  let n=0,unk=0;cols.forEach(([,l])=>{if(!P.langs.includes(l))P.langs.push(l);});
  rows.slice(1).forEach(r=>{const o=map[(r[0]||"").trim()];if(!o){unk++;return;}
    cols.forEach(([i,l])=>{const v=(r[i]||"").trim();if(l===baseLang()){if(v&&v!==o.text){o.text=v;n++;}}else if(v){if(o.tr[l]!==v){o.tr[l]=v;n++;}}});});
  commit();refreshAll();updHeader();
  toast(L("t_csvImported",n,unk?L("t_csvSkipped",unk):"",P.langs.join(", ")),"ok");
}

/* ---------- Schriften ---------- */
const faceKeys=new Set();
function sfntInfo(buf){
  // Liest Familienname und Stärke aus TTF/OTF (name- und OS/2-Tabelle)
  try{const v=new DataView(buf),tag=v.getUint32(0);if(tag!==0x00010000&&tag!==0x4F54544F&&tag!==0x74727565)return null;
    const n=v.getUint16(4),tabs={};for(let i=0;i<n;i++){const o=12+i*16;tabs[String.fromCharCode(v.getUint8(o),v.getUint8(o+1),v.getUint8(o+2),v.getUint8(o+3))]=v.getUint32(o+8);}
    const out={};
    if(tabs.name!=null){const off=tabs.name,cnt=v.getUint16(off+2),so=off+v.getUint16(off+4),best={};
      for(let j=0;j<cnt;j++){const r=off+6+j*12,pid=v.getUint16(r),nid=v.getUint16(r+6),len=v.getUint16(r+8),p=so+v.getUint16(r+10);
        if(nid!==1&&nid!==2&&nid!==16&&nid!==17)continue;let s="";
        if(pid===3||pid===0){for(let k=0;k+1<len;k+=2)s+=String.fromCharCode(v.getUint16(p+k));}else{for(let k=0;k<len;k++)s+=String.fromCharCode(v.getUint8(p+k));}
        if(!best[nid]||pid===3)best[nid]=s;}
      out.family=best[16]||best[1];out.sub=best[17]||best[2]||"";}
    if(tabs["OS/2"]!=null){out.weight=v.getUint16(tabs["OS/2"]+4);out.italic=!!(v.getUint16(tabs["OS/2"]+62)&1);}
    return out;}catch(e){return null;}
}
async function registerFont(ff){
  const key=ff.name+"|"+ff.weight+"|"+ff.style+"|"+ff.data.length;if(faceKeys.has(key))return true;
  try{const buf=await dataURLtoBlob(ff.data).arrayBuffer();const face=new FontFace(ff.name,buf,{weight:ff.weight,style:ff.style});await face.load();document.fonts.add(face);faceKeys.add(key);installed=null;return true;}catch(e){return false;}
}
async function registerAllFonts(){let any=false;for(const f of P.fontFiles)if(await registerFont(f))any=true;if(any){installed=null;if(!playing)renderStage();}}
async function addFontFiles(files){

      const ff={name:(info.family||base.replace(/[-_](regular|bold|medium|light|black|italic|semibold|thin)$/i,"").replace(/[-_]+/g," ")).trim(),
        weight:String(info.weight||(/bold/i.test(base)?700:/medium/i.test(base)?500:/light/i.test(base)?300:/black/i.test(base)?900:400)),style:(info.italic||/italic/i.test(base))?"italic":"normal",
        file:f.name,data:await readAs(f,"readAsDataURL")};
      if(!await registerFont(ff)){toast(L("t_fontBad")+" ("+f.name+")","bad");continue;}
      P.fontFiles=P.fontFiles.filter(x=>!(x.name===ff.name&&x.weight===ff.weight&&x.style===ff.style));P.fontFiles.push(ff);n++;

const isCF=n=>/contraface/i.test(n);
function fontOptions(v,tokens){
  const groups=[],files=[...new Set(P.fontFiles.map(f=>f.name))].filter(isCF);
  if(tokens)groups.push([L("fg_project"),FONTK.map(k=>["{"+k+"}",`${L("font_"+k)} · ${P.fonts[k]}`])]);
  if(files.length)groups.push([L("fg_files"),files.map(n=>[n,n])]);
  groups.push(["STIHL Contraface",FONT_CANDIDATES.filter(n=>isCF(n)&&!files.includes(n)).map(n=>[n,fontAvailable(n)?n:`${n} – ${L("fg_missing")}`])]);
  const all=groups.flatMap(g=>g[1].map(o=>o[0]));
  let h=all.includes(v)?"":`<option value="${esc(v)}" selected>${esc(v)} – ${esc(L("fg_missing"))}</option>`;
  h+=groups.map(([g,os])=>os.length?`<optgroup label="${esc(g)}">${os.map(([val,lab])=>`<option value="${esc(val)}"${val===v?" selected":""}${val[0]==="{"?"":` style="font-family:'${esc(val)}'"`}>${esc(lab)}</option>`).join("")}</optgroup>`:"").join("");
  return h;
}

const svgWrap=inner=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner.replace(/currentColor/g,"#000")}</svg>`;
// Platz für eine fest eingebaute Iconbibliothek: [{name:"...",svg:"<svg …>"}]
const EMBED_ICONS=[];
const STARTER_ICONS=["check","x","plus","arrow","star","heart","warn","info","clock","bolt","battery","leaf","user","pin","globe","sound","music","video","image","spark"].map(n=>({name:n,svg:svgWrap(IC[n])}));
let memIcons=null;
function userIcons(){if(memIcons)return memIcons;try{return JSON.parse(localStorage.getItem(ICONKEY)||"[]");}catch(e){return[];}}
function saveIcons(a){memIcons=a;try{localStorage.setItem(ICONKEY,JSON.stringify(a));}catch(e){toast(L("t_iconsMem"),"bad");}}
function cleanSVG(text){
  try{const d=new DOMParser().parseFromString(text,"image/svg+xml"),s=d.documentElement;
    if(!s||s.nodeName.toLowerCase()!=="svg"||d.getElementsByTagName("parsererror").length)return null;
    [...s.querySelectorAll("script,foreignObject")].forEach(n=>n.remove());
    [s,...s.querySelectorAll("*")].forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/href$/i.test(a.name)&&!/^#/.test(a.value)&&!/^data:image\//.test(a.value)))n.removeAttribute(a.name);}));
    s.setAttribute("xmlns","http://www.w3.org/2000/svg");
    let vb=(s.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(Number);
    if(vb.length!==4||!vb.every(isFinite)||!vb[2]||!vb[3]){const w=parseFloat(s.getAttribute("width"))||24,h=parseFloat(s.getAttribute("height"))||24;vb=[0,0,w,h];s.setAttribute("viewBox",vb.join(" "));}
    s.setAttribute("width","512");s.setAttribute("height",String(Math.round(512*vb[3]/vb[2])||512));
    return new XMLSerializer().serializeToString(s);}catch(e){return null;}
}
async function importIcons(files){
  const a=userIcons().slice();let n=0;
  for(const f of files){if(!/\.svg$/i.test(f.name)&&f.type!=="image/svg+xml")continue;
    const s=cleanSVG(await f.text());if(!s)continue;const name=f.name.replace(/\.svg$/i,"");
    const ex=a.find(x=>x.name===name);if(ex)ex.svg=s;else a.push({name,svg:s});n++;}
  if(!n){toast(L("t_iconsNone"),"bad");return;}
  saveIcons(a);UI.tab="icons";saveUI();renderLeft();toast(L("t_iconsLoaded",n),"ok");
}

function getRef(path){
  if(path==="el.@text"){const e=curEl();if(!e)return[null];if(isBase())return[e,"text"];return[e.tr,curLang()];}
  const a=path.split("."),k=a[0];
  const o=k==="scene"?curScene():k==="el"?curEl():k==="pal"?P.palette:k==="font"?P.fonts:k==="logo"?P.logo:k==="sub"?P.subStyle:k==="mus"?P.music:P;return[o,a[1]];}
function F(label,kind,path,o){o=o||{};const r=getRef(path),v=r[0]?r[0][r[1]]:"";const vv=v==null?"":v;label=esc(label);
  if(kind==="textarea")return `<div class="f full"><textarea data-path="${path}"${o.ph?` placeholder="${esc(o.ph)}"`:""}>${esc(vv)}</textarea></div>`;
  if(kind==="select")return `<div class="f"><span>${label}</span><select data-path="${path}"${o.num?' data-num="1"':""}>${o.opts.map(x=>{const a=Array.isArray(x)?x:[x,x];return `<option value="${esc(a[0])}"${String(a[0])===String(vv)?" selected":""}>${esc(a[1])}</option>`;}).join("")}</select></div>`;
  if(kind==="check")return `<div class="f"><span>${label}</span><input type="checkbox" data-path="${path}"${vv?" checked":""}></div>`;
  if(kind==="number")return `<div class="f"><span>${label}</span><input type="number" data-path="${path}" value="${vv}" step="${o.step||1}"${o.min!=null?` min="${o.min}"`:""}${o.max!=null?` max="${o.max}"`:""}></div>`;
  if(kind==="range")return `<div class="f"><span>${label}</span><div class="rg"><input type="range" data-path="${path}" value="${vv}" min="${o.min}" max="${o.max}" step="${o.step||1}"><output>${Math.round(vv*100)/100}</output></div></div>`;
  if(kind==="font")return `<div class="f"><span>${label}</span><div class="fontrow"><select data-path="${path}">${fontOptions(String(vv),!!o.tokens)}</select><button class="btn sm icon" data-act="fontPick" title="${esc(L("b_loadFont"))}">${ic("upload")}</button></div></div>`;
  return `<div class="f"><span>${label}</span><input type="text" data-path="${path}" value="${esc(vv)}"></div>`;}
function C(label,path,tokens){const r=getRef(path),v=r[0][r[1]],tn=tokName(v);
  return `<div class="f"><span>${esc(label)}</span><div class="crow"><input type="color" data-path="${path}" value="${esc(col(v))}">`+
   (tokens?PALK.map(p=>`<button class="chip${tn===p?" on":""}" title="${esc(L("pal_"+p))}" data-tok="{${p}}" data-path="${path}" style="background:${esc(P.palette[p])}"></button>`).join(""):"")+`</div></div>`;}
const openSecs=new Set();
function sec(key,title,inner){return `<details data-sec="${key}"${openSecs.has(key)?" open":""}><summary>${ic("chev")}${title}</summary><div class="secb">${inner}</div></details>`;}
function seg(path,opts){const r=getRef(path),v=r[0][r[1]];return `<div class="seg">${opts.map(([k,l])=>`<button data-seg="${path}" data-v="${k}" class="${String(v)===String(k)?"on":""}">${esc(l)}</button>`).join("")}</div>`;}

const LABW=150;
function waveSVG(env,dur,T,left,pauses,color){
  if(!env)return "";const B=600,per=env.length/B;let mx=0;for(let k=0;k<env.length;k++)if(env[k]>mx)mx=env[k];mx=mx||1;
  let d="";for(let b=0;b<B;b++){let m=0;const s=Math.floor(b*per),e=Math.min(env.length,Math.floor((b+1)*per)+1);for(let k=s;k<e;k++)if(env[k]>m)m=env[k];const hh=Math.max(.3,m/mx*9);d+=`M${(b*1000/B).toFixed(1)},${10-hh}V${10+hh}`;}
  let ps="";(pauses||[]).forEach(p=>{ps+=`<rect x="${p.a/dur*1000}" y="0" width="${(p.b-p.a)/dur*1000}" height="20" fill="rgba(79,191,122,.22)"/>`;});
  return `<svg class="wave" viewBox="0 0 1000 20" preserveAspectRatio="none" style="left:${left/T*100}%;width:${dur/T*100}%">${ps}<path d="${d}" stroke="${color}" stroke-width="1.2" fill="none" vector-effect="non-scaling-stroke"/></svg>`;
}
function renderTL(){
  const T=total()||1;let h="";
  if(media.el)h+=`<div class="trow"><div class="lab" title="${esc(media.name)}">${ic(media.hasVideo?"video":"sound")}${esc(media.name)}</div><div class="trk">${waveSVG(media.env,media.dur,T,0,media.pauses,"#7d7d88")}</div></div>`;
  if(music.el){let w="";for(let off=0;off<T;off+=music.dur){w+=waveSVG(music.env,music.dur,T,off,null,off?"#5d6b8a":"#7d8fb8");if(!P.music.loop)break;}
    h+=`<div class="trow"><div class="lab" title="${esc(music.name)}">${ic("music")}${esc(L("music"))}</div><div class="trk">${w}</div></div>`;}
  if(P.subs.length)h+=`<div class="trow"><div class="lab">${ic("sub")}${esc(L("h_subs"))} ${esc(curLang())}</div><div class="trk">${P.subs.map(c=>`<div class="cue${missing(c)?" miss":""}" data-cue="${c.id}" title="${esc(txt(c))}" style="left:${c.a/T*100}%;width:${(c.b-c.a)/T*100}%">${esc(txt(c))}</div>`).join("")}</div></div>`;
  h+=`<div class="trow sc"><div class="lab">${ic("scenes")}${esc(L("h_scenes"))}</div><div class="trk">`+
    P.scenes.map((s,i)=>`<div class="blk${i===sel.scene?" on":""}" data-scene="${i}" style="left:${sStart(i)/T*100}%;width:${s.duration/T*100}%"${i&&s.trans!=="none"?` title="${esc(L("tr_"+s.trans))}"`:""}>${i&&s.trans!=="none"?'<i class="tri"></i>':""}${i+1} ${esc(s.name)}</div>`).join("")+
    P.scenes.slice(0,-1).map((s,i)=>`<div class="hdl" data-b="${i}" style="left:${sStart(i+1)/T*100}%" title="${esc(L("tl_boundary"))}"></div>`).join("")+`</div></div>`;
  const s=curScene(),a=sStart(sel.scene),sids=selIds();
  s.elements.slice().reverse().forEach(e=>{
    h+=`<div class="trow"><div class="lab">${ic(typeIc(e))}${esc(elLabel(e))}</div><div class="trk"><div class="span" style="left:${a/T*100}%;width:${s.duration/T*100}%"></div><div class="bar${sids.has(e.id)?" on":""}" data-el="${e.id}" style="left:${(a+e.start)/T*100}%;width:${Math.max(.4,barLen(e)/T*100)}%" title="${esc(L("tl_bar"))}">${esc(elLabel(e))}<i class="bh l"></i><i class="bh r"></i></div></div></div>`;
  });
  h+=`<div id="ph"></div>`;
  $("#tl").innerHTML=`<div id="tlin" style="width:calc(${LABW}px + (100% - ${LABW}px) * ${UI.tlZoom||1})">${h}</div>`;
  updZoomLbl();
  renderStage();
}

let drag=null;
const cpos=ev=>{const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H];};
function snapTargets(ex){const xs=[0,W/2,W],ys=[0,H/2,H],m=Math.min(W,H)*.05;xs.push(m,W-m);ys.push(m,H-m);
  hits.forEach(h=>{if(ex.has(h.id))return;xs.push(h.x,h.x+h.w/2,h.x+h.w);ys.push(h.y,h.y+h.h/2,h.y+h.h);});return{xs,ys};}
function bestSnap(edges,targets,thr){let best=null;edges.forEach(e=>targets.forEach(tg=>{const d=tg-e;if(Math.abs(d)<=thr&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,line:tg};}));return best;}
cv.addEventListener("pointerdown",ev=>{
  if(playing||exporting)return;
  const[px,py]=cpos(ev),u=W/cv.getBoundingClientRect().width;let e=null,mode="move";
  const sh=hits.find(h=>h.id===sel.el);
  if(sh&&Math.abs(px-(sh.x+sh.w+8*u))<16*u&&Math.abs(py-(sh.y+sh.h+8*u))<16*u){e=curEl();mode="resize";}
  else{for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(px>=h.x-8&&px<=h.x+h.w+8&&py>=h.y-8&&py<=h.y+h.h+8){e=curScene().elements.find(x=>x.id===h.id);break;}}}
  if(!e){
    if(sel.el){sel.el=null;refreshAll();}
    const sc=curScene();
    if(sc.showMedia&&media.hasVideo){drag={mode:"media",sx:px,sy:py,ox:sc.mediaX,oy:sc.mediaY,moved:false};cv.setPointerCapture(ev.pointerId);}
    return;
  }
  if(UI.tab!=="scenes"){UI.tab="scenes";saveUI();}
  if(mode==="move"&&(ev.ctrlKey||ev.metaKey)){toggleSel(e.id);renderLeft();renderRight();renderTL();return;}
  if(mode==="move")pickSel(e.id);
  renderLeft();renderRight();renderTL();
  const members=mode==="move"?withGroups(selEls(),ev.altKey):[e];
  const ids=new Set(members.map(m=>m.id)),mh=hits.filter(h=>ids.has(h.id));
  const box=mh.length?{x:Math.min(...mh.map(h=>h.x)),y:Math.min(...mh.map(h=>h.y)),r:Math.max(...mh.map(h=>h.x+h.w)),b:Math.max(...mh.map(h=>h.y+h.h))}:null;
  drag={e,mode,members:members.map(m=>({m,ox:m.x,oy:m.y})),sx:px,sy:py,ow:e.w,oh:e.h,box,hit:sh&&sh.id===e.id?sh:hits.find(h=>h.id===e.id),tg:snapTargets(ids),moved:false,gl:null};
  cv.setPointerCapture(ev.pointerId);
});
cv.addEventListener("pointermove",ev=>{
  if(!drag)return;const[px,py]=cpos(ev);let dxp=px-drag.sx,dyp=py-drag.sy;
  if(Math.abs(dxp)+Math.abs(dyp)>2)drag.moved=true;
  const u=W/cv.getBoundingClientRect().width,thr=7*u,doSnap=UI.snap&&!ev.altKey;drag.gl=null;
  if(drag.mode==="media"){const sc=curScene();sc.mediaX=clamp(Math.round((drag.ox+dxp/W*100)*10)/10,-50,50);sc.mediaY=clamp(Math.round((drag.oy+dyp/H*100)*10)/10,-50,50);}
  else if(drag.mode==="move"){
    if(doSnap&&drag.box){const b=drag.box,gl={x:[],y:[]};
      const sx=bestSnap([b.x+dxp,(b.x+b.r)/2+dxp,b.r+dxp],drag.tg.xs,thr);if(sx){dxp+=sx.d;gl.x.push(sx.line);}
      const sy=bestSnap([b.y+dyp,(b.y+b.b)/2+dyp,b.b+dyp],drag.tg.ys,thr);if(sy){dyp+=sy.d;gl.y.push(sy.line);}
      drag.gl=gl;}
    drag.members.forEach(o=>{o.m.x=Math.round((o.ox+dxp/W*100)*100)/100;o.m.y=Math.round((o.oy+dyp/H*100)*100)/100;});
  }else{
    const h=drag.hit;
    if(doSnap&&h){const gl={x:[],y:[]};const sx=bestSnap([h.x+h.w+dxp],drag.tg.xs,thr);if(sx){dxp+=sx.d;gl.x.push(sx.line);}
      if(drag.e.type!=="text"){const sy=bestSnap([h.y+h.h+dyp],drag.tg.ys,thr);if(sy){dyp+=sy.d;gl.y.push(sy.line);}}drag.gl=gl;}
    if(drag.e.type==="icon"&&!ev.shiftKey){
      // Icons proportional skalieren (Umschalt = frei)
      const k=Math.max(.05,(drag.ow/100*W+dxp)/(drag.ow/100*W));drag.e.w=Math.max(1,Math.round(drag.ow*k*100)/100);drag.e.h=Math.max(.3,Math.round(drag.oh*k*100)/100);
    }else{drag.e.w=Math.max(1,Math.round((drag.ow+dxp/W*100)*100)/100);if(drag.e.type!=="text")drag.e.h=Math.max(.3,Math.round((drag.oh+dyp/H*100)*100)/100);}
  }
  renderStage();
});

function setBtn(){$("#bPlay").innerHTML=ic(playing?"pause":"play");}
async function startPlay(from,end){
  if(playing)stopPlay();
  if(media.el||music.el||P.brolls.length)await getCtx().resume();
  playing=true;onEnd=end||null;t0=from;t=from;clock0=performance.now()/1000;setBtn();
  const m=media.el;if(m){try{m.currentTime=Math.min(from,Math.max(0,m.duration-.001));}catch(e){}if(from<m.duration)m.play().catch(()=>{});}
  syncMusic(true);
  requestAnimationFrame(tick);
}
function stopPlay(){playing=false;if(media.el)media.el.pause();if(music.el)music.el.pause();setBtn();renderStage();}
function tick(){
  if(!playing)return;
  const now=performance.now()/1000;t=t0+now-clock0;const m=media.el;
  if(m&&t<m.duration){if(m.paused&&!m.seeking&&!m.ended)m.play().catch(()=>{});else if(Math.abs(m.currentTime-t)>.25)m.currentTime=t;}
  if(t>=total()){
    if(!exporting&&!onEnd&&UI.loop){t0=0;clock0=now;t=0;if(m){m.currentTime=0;m.play().catch(()=>{});}syncMusic(true);}
    else{t=total()-.001;playing=false;if(m)m.pause();if(music.el)music.el.pause();setBtn();renderStage();const f=onEnd;onEnd=null;if(f)f();return;}
  }
  syncMusic(false);
  const Lc=locate(t);
  if(Lc.i!==sel.scene){sel.scene=Lc.i;sel.el=null;renderLeft();renderRight();renderTL();}
  if(exporting)$("#prog").style.width=(t/total()*100)+"%";
  renderStage();requestAnimationFrame(tick);
}

document.addEventListener("keydown",ev=>{
  if(tourI>=0){if(ev.key==="Escape"){endTour();ev.preventDefault();}else if(ev.key==="ArrowRight"||ev.key==="Enter"){tourGo(1);ev.preventDefault();}else if(ev.key==="ArrowLeft"){tourGo(-1);ev.preventDefault();}return;}
  const tag=(ev.target.tagName||"").toLowerCase(),typing=tag==="input"||tag==="textarea"||tag==="select";
  const k=ev.key.toLowerCase(),mod=ev.ctrlKey||ev.metaKey;
  if(mod&&k==="s"){ev.preventDefault();saveProject(ev.shiftKey);return;}
  if(mod&&k==="o"){ev.preventDefault();openProject();return;}
  if(mod&&k==="z"&&!typing){ev.preventDefault();ev.shiftKey?redo():undo();return;}
  if(mod&&k==="y"&&!typing){ev.preventDefault();redo();return;}
  if(mod&&k==="d"&&!typing){ev.preventDefault();dupEl();return;}
  if(ev.key==="Escape"&&!$("#menu").hidden){closeMenu();return;}
  if(typing||document.querySelector("dialog[open]"))return;
  if(ev.code==="Space"){ev.preventDefault();playing?stopPlay():startPlay(t>=total()-.05?0:t);}
  else if(ev.key==="Escape"){if(sel.el){sel.el=null;refreshAll();}}
  else if(ev.key==="Delete"||ev.key==="Backspace"){delEl();}
  else if(k==="g"&&!mod){UI.guides=!UI.guides;saveUI();updToggles();renderStage();}
  else if(ev.key.startsWith("Arrow")&&curEl()){ev.preventDefault();const e=curEl(),d=ev.shiftKey?2:.5;
    const mem=withGroups(selEls(),ev.altKey);
    mem.forEach(m=>{if(ev.key==="ArrowLeft")m.x-=d;if(ev.key==="ArrowRight")m.x+=d;if(ev.key==="ArrowUp")m.y-=d;if(ev.key==="ArrowDown")m.y+=d;m.x=Math.round(m.x*10)/10;m.y=Math.round(m.y*10)/10;});
    commit();renderRight();renderStage();}
});

function recordOnce(lang,n,N){return new Promise(async resolve=>{

    :["video/mp4;codecs=avc1.640028","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m));if(!mime){toast(L("t_noFormat"),"bad");resolve(false);return;}
  const ext=mime.startsWith("video/mp4")?"mp4":"webm",fps=30;

  say(L("st_exporting",N>1?`${n}/${N} `:"",lang));
  await document.fonts.ready;setT(0);
  const tracks=[...cv.captureStream(fps).getVideoTracks()];
  if(withAudio){await getCtx().resume();tracks.push(...graph().rec.stream.getAudioTracks());}
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:W*H>=2e6?16000000:12000000,audioBitsPerSecond:192000});
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=async()=>{
    exporting=false;$("#bVideo").disabled=$("#bPlay").disabled=false;say("");renderStage();
    const ok=await download(new Blob(chunks,{type:mime.split(";")[0]}),`${safeName(P.name)}${P.langs.length>1?"_"+lang:""}_${P.format.replace(":","x")}.${ext}`);
    if(ok)toast(L(ext==="mp4"?"t_expMp4":"t_expWebm",lang),"ok");
    resolve(true);
  };
  rec.start();
  setTimeout(()=>startPlay(0,()=>setTimeout(()=>rec.stop(),250)),150);
});}

- Font sizes in px: titles ${Math.round(90*u)}–${Math.round(140*u)}, headings ${Math.round(60*u)}–${Math.round(80*u)}, body ${Math.round(28*u)}–${Math.round(44*u)}.
- Keep a 5 % safe margin on all sides.
</canvas>

<design_system>
- Colours: use palette tokens "{accent}" (brand orange), "{dark}", "{light}", "{white}", "{grey}" — or hex values only when necessary.
- Fonts: "{head}" for headlines and numbers, "{label}" for labels and bullet points, "{body}" for running text.
- Style: bold, clean corporate motion design; few words per scene; strong contrast; one key message per scene.
</design_system>

<timing>
- Times in seconds; "start" and "dur" are relative to the start of the scene.
- Scenes of about 3–8 s; stagger elements (start offsets of 0.2–0.4 s); entrance animations 0.4–0.8 s.
</timing>

<schema>
{
 "name": "Video title",
 "format": "${f[0]}",
 "langs": ${JSON.stringify(P.langs)},
 "scenes": [
  {"name":"Intro","duration":4.5,"bg":"{dark}","zoom":3,"zoomDir":"in","trans":"none","transColor":"{accent}","transDur":0.6,"showMedia":false,"dim":0,"elements":[
    {"type":"text","text":"Headline"${others.length?`,"tr":{${others.map(l=>`"${l}":"…"`).join(",")}}`:""},"x":8,"y":34,"w":80,"size":${Math.round(112*u)},"weight":800,"font":"{head}","color":"{white}","align":"left","lineHeight":1,"letterSpacing":0,"upper":true,"shrink":true,"anim":"slide-up","ease":"out","start":0.3,"dur":0.8,"exit":"none","opacity":1},
    {"type":"shape","x":8,"y":52,"w":12,"h":0.7,"color":"{accent}","radius":0,"skew":0,"anim":"wipe","start":0.7,"dur":0.6}
  ]}
 ],
 "subs": [ {"a":0.5,"b":3.2,"text":"Subtitle in the source language"} ]
}
</schema>

<allowed_values>
- type: text | shape | video (video = window showing the loaded speaker video; for a round picture-in-picture use radius 9999 and the same size in pixels for width and height, e.g. at the side of the frame, without frame or caption). Do not use image or icon.

  const r=el.getBoundingClientRect(),p=6,x=Math.max(4,r.left-p),y=Math.max(4,r.top-p),w=Math.min(vw-8,r.right+p)-x,h=Math.min(vh-8,r.bottom+p)-y;

  el.addEventListener("pointerdown",ev=>{on=true;el.classList.add("on");el.setPointerCapture(ev.pointerId);ev.preventDefault();});
  el.addEventListener("pointermove",ev=>{
    if(!on)return;const a=$("#app").getBoundingClientRect();
    const v=key==="lw"?ev.clientX-a.left:key==="rw"?a.right-ev.clientX:a.bottom-ev.clientY;
    let lim=LIM[key];
    if(key==="th")lim=[lim[0],Math.min(lim[1],a.height-52-200)];
    else lim=[lim[0],Math.min(lim[1],(a.width-(key==="lw"?UI.rw:UI.lw))-320)];
    UI[key]=Math.round(clamp(v,lim[0],Math.max(lim[0],lim[1])));applyLayout();renderStage();
  });
  const end=()=>{if(on){on=false;el.classList.remove("on");saveUI();renderTL();}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("dblclick",()=>{UI[key]=LDEF[key];applyLayout();saveUI();renderStage();});
});
